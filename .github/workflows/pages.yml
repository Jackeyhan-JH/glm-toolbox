name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 检查、测试并发布
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 清单与约定检查
        run: npm run check

      - name: 单元测试
        run: npm test

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        run: npm run e2e

      - name: 构建 dist/
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
